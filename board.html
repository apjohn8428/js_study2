<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        textarea {
            width: 300px;
            height: 120px;
            padding: 10px;
            font-size: 15px;
            background-color: azure;
        }
    </style>
    <title>게시판 글쓰기</title>
</head>
<body>
    <h2>문의 내용 작성</h2>
    <hr>
    <textarea id="message" maxlength="10" placeholder="문의 내용을 10자 이내로 입력하세요"></textarea>
    <p id="counter">
        0 / 10자
    </p>

    <script>
        const message = document.getElementById("message");
        const counter = document.getElementById("counter");

        // 사용자가 입력창에 입력,제거, 붙여넣기 이벤트가 발생했을 때 함수 실행
        message.addEventListener("input", function() {
            let messagelength = message.value.length;
            counter.textContent = messagelength + " / 10자";

            if(messagelength > 10) {
                alert("문의 내용은 10자 이내여야 합니다")
            }
        });
    </script>
</body>
</html>
