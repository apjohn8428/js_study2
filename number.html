<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 자바스크립트 예제</title>
</head>
<body>
    <h1>숫자 증감 프로그램</h1>
    <h2 id="number">0</h2>

    <button type="button" onclick="increase()">증가</button>
    <button type="button" onclick="decrease()">감소</button>
    <button type="button" onclick="reset()">초기화</button>

    <script>
        let count = 0;
        document.getElementById("number").textContent = count; // 카운트 값으로 변경

        function increase() {
            count = count + 1;
            document.getElementById("number").textContent = count;
            console.log(count);
        }

        function decrease() {
            count = count - 1;
            document.getElementById("number").textContent = count;
            console.log(count);
        }

        function reset() {
            count = 0;
            document.getElementById("number").textContent = count;
            console.log(count);
        }
    </script>
</body>
</html>
